<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A page of playing cards made with HTML and Flexbox CSS.">
  <title>Playing Cards</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23123f35'/%3E%3Ctext x='16' y='25' text-anchor='middle' font-size='27' fill='%23ffffff'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">

  <style>
    /* Page colors and heading */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 60px 20px;
      background-color: #123f35;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    header {
      margin-bottom: 40px;
      text-align: center;
    }

    .suits {
      margin: 0 0 12px;
      color: #e8c982;
      font-size: 26px;
      letter-spacing: 10px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 46px;
      font-weight: normal;
    }

    /* Center the cards, wrap them, and leave a 20px gap. */
    #playing-cards {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Each card has three parts spaced across a horizontal row. */
    .card {
      display: flex;
      justify-content: space-between;
      width: 220px;
      height: 320px;
      padding: 18px;
      border: 1px solid #d8d5ca;
      border-radius: 14px;
      background-color: #ffffff;
      color: #18251f;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-6px);
    }

    /* These properties position the three parts vertically. */
    .left {
      align-self: flex-start;
    }

    .middle {
      align-self: center;
      display: flex;
      flex-direction: column;
      font-size: 62px;
      line-height: 1.1;
    }

    .right {
      align-self: flex-end;
      transform: rotate(180deg);
    }

    /* Stack the rank and suit in each corner. */
    .left,
    .right {
      font-family: Georgia, serif;
      font-size: 26px;
      line-height: 1.1;
      text-align: center;
    }

    .left span,
    .right span {
      display: block;
    }

    .red {
      color: #bc3040;
    }

    /* The cards wrap automatically. Only the heading needs resizing. */
    @media (max-width: 500px) {
      body {
        padding: 35px 15px;
      }

      h1 {
        font-size: 36px;
      }
    }

    /* Respect the browser's reduced-motion setting. */
    @media (prefers-reduced-motion: reduce) {
      .card {
        transition: none;
      }

      .card:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <p class="suits" aria-hidden="true">♠ ♥ ♣ ♦</p>
    <h1>Playing cards</h1>
  </header>

  <main id="playing-cards">
    <div class="card" role="img" aria-label="Ace of spades">
      <div class="left" aria-hidden="true">
        <span>A</span>
        <span>♠</span>
      </div>
      <div class="middle" aria-hidden="true">
        <span>♠</span>
      </div>
      <div class="right" aria-hidden="true">
        <span>A</span>
        <span>♠</span>
      </div>
    </div>

    <div class="card red" role="img" aria-label="Two of hearts">
      <div class="left" aria-hidden="true">
        <span>2</span>
        <span>♥</span>
      </div>
      <div class="middle" aria-hidden="true">
        <span>♥</span>
        <span>♥</span>
      </div>
      <div class="right" aria-hidden="true">
        <span>2</span>
        <span>♥</span>
      </div>
    </div>

    <div class="card" role="img" aria-label="Three of clubs">
      <div class="left" aria-hidden="true">
        <span>3</span>
        <span>♣</span>
      </div>
      <div class="middle" aria-hidden="true">
        <span>♣</span>
        <span>♣</span>
        <span>♣</span>
      </div>
      <div class="right" aria-hidden="true">
        <span>3</span>
        <span>♣</span>
      </div>
    </div>
  </main>
</body>
</html>
